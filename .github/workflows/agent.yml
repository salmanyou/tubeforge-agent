name: Tube Forge Agent

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours — well inside the default 10,000-unit daily YouTube API quota
  workflow_dispatch: {}      # lets you trigger a run manually from the Actions tab

permissions:
  contents: write
  issues: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - name: Run agent
        id: run_agent
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          CHANNEL_HANDLE: ${{ secrets.CHANNEL_HANDLE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node src/agent.js

      - name: Commit updated state + log
        if: steps.run_agent.outcome == 'success'
        run: |
          git config user.name "tubeforge-agent"
          git config user.email "actions@github.com"
          git add data/state.json data/history.jsonl
          git diff --cached --quiet || git commit -m "Agent run: $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed (likely another run pushed first) — retrying..."
            sleep 5
          done

      - name: Open/update alert issue on failure
        if: steps.run_agent.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --label agent-failure --state open --json number -q '.[0].number' || true)
          if [ -z "$EXISTING" ]; then
            gh issue create --title "Tube Forge Agent run failed" --label agent-failure \
              --body "A scheduled run failed at $(date -u +'%Y-%m-%d %H:%M UTC'). Log: $RUN_URL"
          else
            gh issue comment "$EXISTING" --body "Failed again at $(date -u +'%Y-%m-%d %H:%M UTC'). Log: $RUN_URL"
          fi

      - name: Close alert issue on recovery
        if: steps.run_agent.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list --label agent-failure --state open --json number -q '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Resolved — a subsequent run succeeded."
            gh issue close "$EXISTING"
          fi

      - name: Fail the job if the agent run failed
        if: steps.run_agent.outcome == 'failure'
        run: exit 1
